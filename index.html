<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="referrer"
      content="strict-origin-when-cross-origin">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#player {
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

function onYouTubeIframeAPIReady() {

    player = new YT.Player('player', {

        videoId: 'XXL29qKb0Jo',

        width: '100%',
        height: '100%',

        playerVars: {
            autoplay: 1,
            mute: 1,
            controls: 0,
            playsinline: 1,
            loop: 1,
            playlist: 'XXL29qKb0Jo',
            origin: window.location.origin
        },

        events: {
            onReady: function(event) {
                event.target.mute();
                event.target.playVideo();
            },

            onStateChange: function(event) {
                if (event.data === YT.PlayerState.ENDED) {
                    event.target.playVideo();
                }
            }
        }
    });
}
</script>

</body>
</html>
